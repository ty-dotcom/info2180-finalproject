<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
		<title>Dolphin CRM</title>
		<link href="dolphin_crm.css" type="text/css" rel="stylesheet" />
		<script src="contacts.js" type="text/javascript"></script>
	</head>

	<body>
        <div class="layout">
            <header>
                <img src="images/dolphin.png" alt="A Dolphin Icon"/>
                <h1>Dolphin CRM</h1>
            </header>

            <aside class="sidebar">
                <a href="dashboard.html">
                    <img src="images/home.png" alt="A Home Icon"/>
                    Home
                </a>
                <a href="new_contact.html">
                    <img src="images/profile.png" alt="A Profile Icon"/>
                    New Contact
                </a>
                <a href="users.html">
                    <img src="images/users.png" alt="Users Icon"/>
                    Users
                </a>
                <a href="login.html">
                    <img src="images/logout.png" alt="A Logout Icon"/>
                    Logout
                </a>
            </aside>

            <main>
                <div class="main-heading">
                    <h2>Dashboard</h2>
                    <a class="addContactBtn">
                        <img src="images/plus.png" alt="A Plus Icon"/>
                        Add Contact
                    </a>
                </div>
                <div class="box">
                    <div class="filters">
                        <img src="images/filter.png" alt="A Plus Icon"/>
                        <h3>Filter By:</h3>
                        <div class="buttons">
                            <button class="is-active">All</button>
                            <button>Sales Leads</button>
                            <button>Support</button>
                            <button>Assigned to me</button>
                        </div>
                        
                    </div>
                    <div class="table-container dashboard">
                        
                    </div>
                    
                </div>
            </main>
            <footer>
                <div class="container">
                    <p>Copyright &copy 2026 Dolphin CRM</p>
                </div>
            </footer>
        </div>

	</body>
</html>
