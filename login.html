<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
		<title>Dolphin CRM</title>
		<link href="dolphin_crm.css" type="text/css" rel="stylesheet" />
		<script src="dolphin_crm.js" type="text/javascript"></script>
	</head>
	<body>
        <div class="login-layout">
            <header>
			<img src="images/dolphin.png" alt="A Dolphin Icon"/>
			<h1>Dolphin CRM</h1>
		</header>

		<main class="login">
            <div class="container">
                <h2>Login</h2>
                <form action="#" method="post">
                <input type="email" name="email" id="email" placeholder="Enter your email">
                <input type="password" name="password" id="password" placeholder="Enter your password">
                <button type="submit" class="loginBtn">
                    <img src="images/lock.png" alt="A Lock Icon"/>
                    Login
                </button>
            </form>
            </div>
		</main>
        <footer>
            <div class="container">
                <p>Copyright &copy 2026 Dolphin CRM</p>
            </div>
        </footer>

        </div>
	</body>
</html>
