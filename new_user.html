<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
		<title>Dolphin CRM</title>
		<link href="dolphin_crm.css" type="text/css" rel="stylesheet" />
		<script src="new_users.js" type="text/javascript"></script>
	</head>

	<body>
        <div class="layout">
            <header>
                <img src="images/dolphin.png" alt="A Dolphin Icon"/>
                <h1>Dolphin CRM</h1>
            </header>

            <aside class="sidebar">
                <a href="dashboard.html">
                    <img src="images/home.png" alt="A Home Icon"/>
                    Home
                </a>
                <a href="new_contact.html">
                    <img src="images/profile.png" alt="A Profile Icon"/>
                    New Contact
                </a>
                <a href="users.html">
                    <img src="images/users.png" alt="Users Icon"/>
                    Users
                </a>
                <a href="login.html">
                    <img src="images/logout.png" alt="A Logout Icon"/>
                    Logout
                </a>
            </aside>

            <main>
                <div class="main-heading">
                    <h2>New User</h2>
                </div>
                <div class="box">
                    <form action="" method="post" class="newUser">
                        <div class="input-groups">
                            <div class="inputs">
                            <label for="firstname">First Name</label>
                            <input type="text" name="firstname" id="firstname" required placeholder="John">

                        </div>
                        <div class="inputs">
                            <label for="lastname">Last Name</label>
                            <input type="text" name="lastname" id="lastname" required placeholder="Doe">

                        </div>
                        <div class="inputs">
                            <label for="firstname">Email</label>
                            <input type="email" name="email" id="email" required placeholder="something@example.com">

                        </div>
                        <div class="inputs">
                            <label for="firstname">Password</label>
                            <input type="password" name="password" id="password" required 
                            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]{8,}$" title="Must include at least 1 capital letter, a common letter, a number and be 8 characters long.">

                        </div>
                        <div class="inputs">
                            <label for="Role">Role</label>
                            <select name="Role" id="Role">
                                <option value="Member">Member</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>
                        </div>
                        
                        <div class="save-box">
                             <p class="results"></p>

                             <button type="submit" class="saveUserBtn">Save</button>
                        </div>

                    </form>
                    
                    
                </div>
            </main>
            <footer>
                <div class="container">
                    <p>Copyright &copy 2026 Dolphin CRM</p>
                </div>
            </footer>
        </div>

	</body>
</html>
